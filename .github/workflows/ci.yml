name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: typecheck · test · bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Catches the class of bug that shipped silently before CI existed:
      # a type error never blocked a deploy because wrangler bundles with
      # esbuild, which does not typecheck.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      # Same bundle wrangler would upload, without uploading it.
      - name: Bundle (dry run)
        run: npm run build
