name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: typecheck · test · bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The unit suite spans BOTH packages: vitest runs from the root and picks
      # up `backoffice/src/**/*.test.ts`, and `connection-config-writable.test.ts`
      # deliberately imports the backoffice's own module to assert the two key
      # lists agree. Root `npm ci` does not install the backoffice's
      # dependencies, so the moment a backoffice module imports anything
      # external the whole run fails to resolve it — locally invisible, because
      # developing the backoffice means having installed them.
      - name: Install backoffice dependencies
        run: npm ci --prefix backoffice

      # Catches the class of bug that shipped silently before CI existed:
      # a type error never blocked a deploy because wrangler bundles with
      # esbuild, which does not typecheck.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      # Same bundle wrangler would upload, without uploading it.
      - name: Bundle (dry run)
        run: npm run build
